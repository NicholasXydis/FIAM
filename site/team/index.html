<!doctype html>
<html lang="en">
  <head>
    <!-- @head -->
    <meta name="theme-color" content="#040309" />
    <title>The Team · QUARCC Purple</title>
    <meta
      name="description"
      content="The people behind QUARCC Purple at the McGill-FIAM Asset Management Hackathon 2026."
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/site/site.css" />
    <script>
      try {
        var d = document.documentElement,
          k = JSON.parse(sessionStorage.getItem("sky:name") || "null"),
          f = sessionStorage.getItem("sky:frame"),
          n = performance.getEntriesByType("navigation")[0],
          r = document.referrer ? new URL(document.referrer) : null;
        if (k && f && k.vw === innerWidth && k.vh === innerHeight && r && r.origin === location.origin && r.pathname === "/" && (!n || n.type === "navigate")) {
          d.setAttribute("data-carry", "");
          d.style.setProperty("--carry", "url(" + f + ")");
        }
      } catch (e) {}
      location.hash && document.documentElement.setAttribute("data-person", "");
    </script>
  </head>
  <body>
    <div id="app" data-page="team"><!-- @app --></div>
    <script type="module" src="/src/site/main.tsx"></script>
  </body>
</html>
