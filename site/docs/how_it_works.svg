<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>How QUARCC Purple works. A monthly forecast, a book built twice a month and trading every day, with code checking every rule on every day. Eight AI agents read and challenge each stage and never set a weight.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B0B5E"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#FFFFFF"/>

  <g stroke="#B9A6C2" stroke-width="2" stroke-dasharray="6 7" fill="none">
    <path d="M205 190 V315"/>
    <path d="M600 190 V315"/>
    <path d="M995 190 V315"/>
  </g>

  <rect x="40" y="40" width="330" height="150" rx="18" fill="#EFEEF1"/>
  <text x="68" y="78" font-size="13" letter-spacing="2" fill="#5B0B5E" font-weight="600">EVERY MONTH</text>
  <text x="68" y="114" font-size="30" fill="#16131A">Forecast</text>
  <text x="68" y="146" font-size="17" fill="#5F5966">Machine learning scores every</text>
  <text x="68" y="168" font-size="17" fill="#5F5966">US stock on about 150 signals</text>

  <rect x="435" y="40" width="330" height="150" rx="18" fill="#5B0B5E"/>
  <text x="463" y="78" font-size="13" letter-spacing="2" fill="#E4C9EA" font-weight="600">TWICE A MONTH</text>
  <text x="463" y="114" font-size="30" fill="#FFFFFF">Build the book</text>
  <text x="463" y="146" font-size="17" fill="#F1E6F4">An optimiser picks about 300</text>
  <text x="463" y="168" font-size="17" fill="#F1E6F4">longs and shorts in the rules</text>

  <rect x="830" y="40" width="330" height="150" rx="18" fill="#16131A"/>
  <text x="858" y="78" font-size="13" letter-spacing="2" fill="#C9B6D2" font-weight="600">EVERY DAY</text>
  <text x="858" y="114" font-size="30" fill="#FFFFFF">Trade</text>
  <text x="858" y="146" font-size="17" fill="#D9D4DE">Over five days, at most</text>
  <text x="858" y="168" font-size="17" fill="#D9D4DE">10% of a stock's volume</text>

  <path d="M374 115 H428" stroke="#5B0B5E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M769 115 H823" stroke="#5B0B5E" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="40" y="222" width="1120" height="58" rx="14" fill="#F4EEF6" stroke="#5B0B5E" stroke-width="1.5"/>
  <text x="600" y="258" font-size="20" fill="#5B0B5E" font-weight="600" text-anchor="middle">Code checks every rule on every day</text>

  <g font-size="17">
    <g transform="translate(40 315)">
      <rect width="330" height="56" rx="28" fill="#FFFFFF" stroke="#D9CFE0" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="6" fill="#5B0B5E"/>
      <text x="46" y="34" fill="#16131A"><tspan font-weight="600">Triage</tspan><tspan fill="#5F5966"> · sorts the company news</tspan></text>
    </g>
    <g transform="translate(40 383)">
      <rect width="330" height="56" rx="28" fill="#FFFFFF" stroke="#D9CFE0" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="6" fill="#5B0B5E"/>
      <text x="46" y="34" fill="#16131A"><tspan font-weight="600">Analyst</tspan><tspan fill="#5F5966"> · reads company reports</tspan></text>
    </g>

    <g transform="translate(435 315)">
      <rect width="330" height="56" rx="28" fill="#FFFFFF" stroke="#D9CFE0" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="6" fill="#5B0B5E"/>
      <text x="46" y="34" fill="#16131A"><tspan font-weight="600">Explainer</tspan><tspan fill="#5F5966"> · explains our big bets</tspan></text>
    </g>
    <g transform="translate(435 383)">
      <rect width="330" height="56" rx="28" fill="#FFFFFF" stroke="#D9CFE0" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="6" fill="#5B0B5E"/>
      <text x="46" y="34" fill="#16131A"><tspan font-weight="600">Devil's advocate</tspan><tspan fill="#5F5966"> · attacks the book</tspan></text>
    </g>
    <g transform="translate(435 451)">
      <rect width="330" height="56" rx="28" fill="#FFFFFF" stroke="#D9CFE0" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="6" fill="#5B0B5E"/>
      <text x="46" y="34" fill="#16131A"><tspan font-weight="600">Risk desk</tspan><tspan fill="#5F5966"> · writes the risk note</tspan></text>
    </g>
    <g transform="translate(435 519)">
      <rect width="330" height="56" rx="28" fill="#FFFFFF" stroke="#D9CFE0" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="6" fill="#5B0B5E"/>
      <text x="46" y="34" fill="#16131A"><tspan font-weight="600">AI crowd</tspan><tspan fill="#5F5966"> · measures crowding</tspan></text>
    </g>

    <g transform="translate(830 315)">
      <rect width="330" height="56" rx="28" fill="#FFFFFF" stroke="#D9CFE0" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="6" fill="#5B0B5E"/>
      <text x="46" y="34" fill="#16131A"><tspan font-weight="600">Rules reader</tspan><tspan fill="#5F5966"> · checks the rules</tspan></text>
    </g>
    <g transform="translate(830 383)">
      <rect width="330" height="56" rx="28" fill="#FFFFFF" stroke="#D9CFE0" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="6" fill="#5B0B5E"/>
      <text x="46" y="34" fill="#16131A"><tspan font-weight="600">Memo writer</tspan><tspan fill="#5F5966"> · writes the letter</tspan></text>
    </g>
  </g>

  <text x="600" y="632" font-size="20" fill="#16131A" text-anchor="middle"><tspan font-weight="600">Eight AI agents read and challenge the fund.</tspan><tspan fill="#5B0B5E"> They never set a weight.</tspan></text>
</svg>
