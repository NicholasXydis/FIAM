<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530">
  <title>How QUARCC Purple works. About 2,250 US stocks are scored on 150 signals, built into a book of about 300 positions and traded over five days, giving a $1bn book with a beta of 0.01. Code checks the rules every day, and eight AI agents check every step without trading.</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
      .ink { fill: none; stroke: #5B0B5E; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      .white { fill: none; stroke: #FFFFFF; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      .label { font-size: 24px; font-weight: 600; fill: #1f1b24; }
      .sub { font-size: 17px; fill: #857d8f; }
      .aink { fill: none; stroke: #5B0B5E; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf6fb"/>
      <stop offset="1" stop-color="#ebdff0"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#83288c"/>
      <stop offset="1" stop-color="#4a0650"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d2636"/>
      <stop offset="1" stop-color="#0d0a12"/>
    </linearGradient>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5B0B5E" flood-opacity="0.13"/>
    </filter>
    <filter id="lift2" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5B0B5E" flood-opacity="0.12"/>
    </filter>
    <marker id="chev" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#b48ec0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="528" rx="24" fill="#FFFFFF" stroke="#ece6f0" stroke-width="2"/>

  <g stroke="#d3bfdc" stroke-width="2.6" stroke-linecap="round" marker-end="url(#chev)">
    <path d="M208 118 H300"/>
    <path d="M438 118 H530"/>
    <path d="M668 118 H760"/>
    <path d="M898 118 H990"/>
  </g>

  <g transform="translate(140 118)">
    <circle r="56" fill="url(#soft)" filter="url(#lift)"/>
    <g fill="#5B0B5E">
      <circle cx="-14" cy="-14" r="4"/><circle cx="0" cy="-14" r="4"/><circle cx="14" cy="-14" r="4"/>
      <circle cx="-14" cy="0" r="4"/><circle cx="0" cy="0" r="4"/><circle cx="14" cy="0" r="4"/>
      <circle cx="-14" cy="14" r="4"/><circle cx="0" cy="14" r="4"/><circle cx="14" cy="14" r="4"/>
    </g>
  </g>
  <text class="label" x="140" y="214">Market</text>
  <text class="sub" x="140" y="242">2,250 stocks</text>

  <g transform="translate(370 118)">
    <circle r="56" fill="url(#soft)" filter="url(#lift)"/>
    <path class="ink" d="M-17 -12 H17 M-17 0 H8 M-17 12 H-1" stroke-width="6"/>
  </g>
  <text class="label" x="370" y="214">Score</text>
  <text class="sub" x="370" y="242">150 signals</text>

  <g transform="translate(600 118)">
    <circle r="56" fill="url(#purple)" filter="url(#lift)"/>
    <path class="white" d="M0 -18 V17 M-11 17 H11 M-18 -9 H18 M-18 -9 L-24 5 M-18 -9 L-12 5 M-25 5 Q-18 13 -11 5 M18 -9 L12 5 M18 -9 L24 5 M11 5 Q18 13 25 5"/>
  </g>
  <text class="label" x="600" y="214">Build</text>
  <text class="sub" x="600" y="242">300 positions</text>

  <g transform="translate(830 118)">
    <circle r="56" fill="url(#soft)" filter="url(#lift)"/>
    <path class="ink" d="M-17 -7 H14 M7 -14 L14 -7 L7 0 M17 8 H-14 M-7 1 L-14 8 L-7 15"/>
  </g>
  <text class="label" x="830" y="214">Trade</text>
  <text class="sub" x="830" y="242">over 5 days</text>

  <g transform="translate(1060 118)">
    <circle r="56" fill="url(#night)" filter="url(#lift)"/>
    <path d="M-22 6 C-15 -16 -8 21 0 0 S14 -19 22 4" fill="none" stroke="#6f6679" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M-22 -1 H22" fill="none" stroke="#f2c14e" stroke-width="3.6" stroke-linecap="round"/>
  </g>
  <text class="label" x="1060" y="214">$1bn book</text>
  <text class="sub" x="1060" y="242">beta 0.01</text>

  <rect x="120" y="276" width="960" height="50" rx="25" fill="#f8f4fa" stroke="#eadff0" stroke-width="1.5"/>
  <g transform="translate(452 301)">
    <rect x="-8" y="-3" width="16" height="12" rx="3" fill="none" stroke="#5B0B5E" stroke-width="2.2"/>
    <path d="M-4.5 -3 V-7 A4.5 4.5 0 0 1 4.5 -7 V-3" fill="none" stroke="#5B0B5E" stroke-width="2.2"/>
  </g>
  <text x="614" y="307" font-size="18" font-weight="600" fill="#5B0B5E">Rules checked by code, every day</text>

  <rect x="120" y="350" width="960" height="112" rx="28" fill="#f8f4fa" stroke="#eadff0" stroke-width="1.5"/>
  <g transform="translate(187 386)"><circle r="26" fill="#FFFFFF" filter="url(#lift2)"/><g transform="scale(1.1)"><path class="aink" d="M-7 -10 H4 L8 -6 V10 H-7 Z M-3 -2 H4 M-3 3 H4"/></g></g>
  <text x="187" y="442" font-size="15" font-weight="600" fill="#3d3846">Rules reader</text>
  <g transform="translate(305 386)"><circle r="26" fill="#FFFFFF" filter="url(#lift2)"/><g transform="scale(1.1)"><path class="aink" d="M-9 -8 H9 L2 1 V8 L-2 10 V1 Z"/></g></g>
  <text x="305" y="442" font-size="15" font-weight="600" fill="#3d3846">Triage</text>
  <g transform="translate(423 386)"><circle r="26" fill="#FFFFFF" filter="url(#lift2)"/><g transform="scale(1.1)"><circle cx="-2" cy="-2" r="6" class="aink"/><path class="aink" d="M3 3 L9 9"/></g></g>
  <text x="423" y="442" font-size="15" font-weight="600" fill="#3d3846">Analyst</text>
  <g transform="translate(541 386)"><circle r="26" fill="#FFFFFF" filter="url(#lift2)"/><g transform="scale(1.1)"><path class="aink" d="M-9 -7 H9 V5 H-1 L-6 9 V5 H-9 Z"/></g></g>
  <text x="541" y="442" font-size="15" font-weight="600" fill="#3d3846">Explainer</text>
  <g transform="translate(659 386)"><circle r="26" fill="#FFFFFF" filter="url(#lift2)"/><g transform="scale(1.1)"><path class="aink" d="M-8 8 L-6 2 L5 -9 L9 -5 L-2 6 Z M2 -6 L6 -2"/></g></g>
  <text x="659" y="442" font-size="15" font-weight="600" fill="#3d3846">Memo writer</text>
  <g transform="translate(777 386)"><circle r="26" fill="#FFFFFF" filter="url(#lift2)"/><g transform="scale(1.1)"><path d="M2 -10 L-6 2 H0 L-2 10 L6 -2 H0 Z" fill="#5B0B5E"/></g></g>
  <text x="777" y="442" font-size="15" font-weight="600" fill="#3d3846">Devil's advocate</text>
  <g transform="translate(895 386)"><circle r="26" fill="#FFFFFF" filter="url(#lift2)"/><g transform="scale(1.1)"><path class="aink" d="M0 -10 L8 -6 V0 Q8 7 0 10 Q-8 7 -8 0 V-6 Z"/></g></g>
  <text x="895" y="442" font-size="15" font-weight="600" fill="#3d3846">Risk desk</text>
  <g transform="translate(1013 386)"><circle r="26" fill="#FFFFFF" filter="url(#lift2)"/><g transform="scale(1.1)"><circle cx="-5" cy="-4" r="3" class="aink"/><circle cx="5" cy="-4" r="3" class="aink"/><path class="aink" d="M-11 8 Q-5 -1 1 8 M-1 8 Q5 -1 11 8"/></g></g>
  <text x="1013" y="442" font-size="15" font-weight="600" fill="#3d3846">AI crowd</text>

  <text x="600" y="500" font-size="18" fill="#6b6475">8 AI agents check every step. None of them can trade.</text>
</svg>
