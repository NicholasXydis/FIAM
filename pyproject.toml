# `uv run run.py` reads this: it fetches Python 3.14 and the locked versions in uv.lock on
# Windows, macOS and Linux. requirements.txt pins the same versions for pip.

[project]
name = "fiam"
version = "1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pyarrow==25.0.1",
    "pandas==3.0.3",
    "numpy==2.5.1",
    "scipy==1.18.1",
    "cvxpy==1.9.3",
    "statsmodels==0.15.0",
    "matplotlib==3.11.0",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    # torch 2.14 for macOS needs Apple silicon and macOS 14 (Darwin 23). Older Macs skip it, and
    # there only the model comparison (--ml) is unavailable.
    "torch==2.14.0; sys_platform != 'darwin' or (platform_machine == 'arm64' and platform_release >= '23')",
]

[dependency-groups]
dev = ["ruff==0.15.17", "pytest==9.1.1"]

[tool.uv]
package = false

# Windows and Linux use the +cpu builds the numbers were made with, from PyTorch's own index.
# macOS has no +cpu build; its PyPI build is CPU-only already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Ruff settings.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E and F catch real bugs. I keeps everyone's imports in the same order.
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# The ledger is a wide text table; wrapping its rows would make it unreadable.
"src/exhibits/config_log.py" = ["E501"]

[tool.ruff.format]
# Match what src/ already uses.
quote-style = "double"

[tool.pytest.ini_options]
# Synthetic data only, so the tests pass on a fresh clone with no data/ folder.
testpaths = ["tests"]
