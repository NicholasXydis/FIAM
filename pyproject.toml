# uv reads this: Python 3.14 and the versions locked in uv.lock; requirements.txt pins them for pip.

[project]
name = "fiam"
version = "1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pyarrow==25.0.1",
    "pandas==3.0.3",
    "numpy==2.5.1",
    "scipy==1.18.1",
    "cvxpy==1.9.3",
    "statsmodels==0.15.0",
    "matplotlib==3.11.0",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    # torch 2.14 on macOS needs Apple silicon and macOS 14; older Macs skip it and lose only --ml.
    "torch==2.14.0; sys_platform != 'darwin' or (platform_machine == 'arm64' and platform_release >= '23')",
    "transformers==5.17.0",
    "python-pptx==1.0.2",
    "pypdf==6.19.0",
    "exchange-calendars==4.13.2",
]

[project.optional-dependencies]
# The accounting replay only (uv sync --extra backtest); the book and MAIN.py never need it.
backtest = ["nautilus_trader[visualization]==1.230.0"]

[dependency-groups]
dev = [
    "ruff==0.15.17",
    "pytest==9.1.1",
]

[tool.uv]
package = false

# Windows and Linux take PyTorch's +cpu builds; macOS's PyPI build is CPU-only already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Ruff settings.

[tool.ruff]
line-length = 100
target-version = "py314"
# Generated by tools/build_main.py from the files it carries, which are linted themselves.
extend-exclude = ["MAIN.py", "fiam/v4b"]

[tool.ruff.lint]
# E and F catch real bugs. I keeps everyone's imports in the same order.
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# The ledger is a wide text table; wrapping its rows would make it unreadable.
"fiam/exhibits/config_log.py" = ["E501"]

[tool.ruff.format]
# Match what the code already uses.
quote-style = "double"

[tool.pytest.ini_options]
# Synthetic data only, so the tests pass on a fresh clone with no data/ folder.
testpaths = ["tests"]
pythonpath = ["."]
