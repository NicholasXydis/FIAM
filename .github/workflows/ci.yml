# Windows, macOS and Linux: lint, test, then the one command with no data, from the repo and MAIN.py.
# The website gets its own job, the same checks as pnpm check on a laptop.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# The lock file is the truth: a pyproject change without uv lock fails here, not on a judge's PC.
env:
  UV_LOCKED: "1"

# A newer push cancels the branch's older run; main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # LightGBM on macOS needs Homebrew's OpenMP; Windows and Linux ship their own.
      - if: runner.os == 'macOS'
        run: brew install libomp
      - run: uv run ruff check fiam run.py tests tools
      - run: uv run ruff format --check fiam run.py tests tools
      - run: uv run pytest
      - run: uv run run.py
      - name: MAIN.py alone in an empty folder
        shell: bash
        run: |
          uv run python tools/build_main.py --out "$RUNNER_TEMP/judge/MAIN.py"
          cd "$RUNNER_TEMP/judge" && uv run MAIN.py

  # Whether this push or pull request touches the site or this workflow.
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # An unknown base, like a new branch, runs the site job anyway.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BASE" HEAD -- site .github/workflows/ci.yml)"
          else
            changed="unknown"
          fi
          if [ -n "$changed" ]; then site=true; else site=false; fi
          echo "site=$site" >> "$GITHUB_OUTPUT"

  # The website: types, format, comments, budgets, headers, browsers.
  site:
    needs: changes
    # Skipped when site/ is unchanged; a skipped job counts as passed.
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    # Lighthouse's Chrome is only for pnpm check all, so it is skipped.
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm at the version site/package.json names, then Node.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The browsers, cached by the lock file so versions match.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}
      # The three engines the device and quick checks open.
      - run: pnpm exec playwright-core install --with-deps chromium firefox webkit
      - run: pnpm check
